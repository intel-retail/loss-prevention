name: Validate PR

# This repo uses squash-merge with the PR title as the squash commit message,
# so only the PR *title* is validated against Conventional Commits (not every
# commit). DCO sign-off is enforced separately by the DCO GitHub app.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  pull-requests: read
  statuses: write
  checks: write

jobs:
  validate-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            style
            chore
            revert
          requireScope: false
          # Skip title validation for bot PRs carrying these labels.
          ignoreLabels: |
            dependencies
            submodule-update

  validate-body:
    name: Validate PR body
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const botLabels = new Set(['dependencies', 'submodule-update']);
            const labels = (pr.labels || []).map(label => label.name.toLowerCase());
            const isBotPR =
              pr.user?.type === 'Bot' ||
              labels.some(label => botLabels.has(label));

            if (isBotPR) {
              console.log('Skipping PR body validation for bot PR.');
            } else {

            //
            // Validate Issue Reference
            // Accept either:
            //   closes #123
            //   fixes #123
            //   resolves #123
            // OR
            //   ITEP-12345
            //
            const githubIssueRegex =
              /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s*#\d+\b/i;

            const jiraRegex =
              /\b[A-Z][A-Z0-9]+-\d+\b/;

            if (
              !githubIssueRegex.test(body) &&
              !jiraRegex.test(body)
            ) {
              core.setFailed(
                'PR must reference either a GitHub issue (e.g. "closes #123") or a Jira issue (e.g. "ITEP-95891").'
              );
            }

            //
            // Verify template placeholders were replaced
            //
            const placeholders = [
              '#<issue_number>',
              '<issue_number>',
              '<details>'
            ];

            for (const placeholder of placeholders) {
              if (body.includes(placeholder)) {
                core.setFailed(
                  `Template placeholder still exists: ${placeholder}`
                );
              }
            }

            //
            // Validate required sections
            //
            const requiredSections = [
              '## What are you changing?',
              '## Issue this PR closes'
            ];

            for (const section of requiredSections) {
              if (!body.includes(section)) {
                core.setFailed(
                  `Missing required section: ${section}`
                );
              }
            }
            }

            console.log('All PR validation checks passed.');
name: Validate PR

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title, body and commits
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';

            //
            // Conventional Commit format
            //
            const ccRegex =
              /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?(!)?: .+/;

            //
            // Validate PR title
            //
            if (!ccRegex.test(title)) {
              core.setFailed(
                `PR title does not follow Conventional Commits: "${title}"`
              );
            }

            //
            // Validate Issue Reference
            // Accept either:
            //   closes #123
            //   fixes #123
            //   resolves #123
            // OR
            //   ITEP-12345
            //
            const githubIssueRegex =
              /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s*#\d+\b/i;

            const jiraRegex =
              /\b[A-Z][A-Z0-9]+-\d+\b/;

            if (
              !githubIssueRegex.test(body) &&
              !jiraRegex.test(body)
            ) {
              core.setFailed(
                'PR must reference either a GitHub issue (e.g. "closes #123") or a Jira issue (e.g. "ITEP-95891").'
              );
            }

            //
            // Verify template placeholders were replaced
            //
            const placeholders = [
              '#<issue_number>',
              '<issue_number>',
              '<details>'
            ];

            for (const placeholder of placeholders) {
              if (body.includes(placeholder)) {
                core.setFailed(
                  `Template placeholder still exists: ${placeholder}`
                );
              }
            }

            //
            // Validate required sections
            //
            const requiredSections = [
              '## What are you changing?',
              '## Issue this PR closes',
              '## PR Checklist',
              '## Does this change results or break compatibility?',
              '## Security',
              '## Test instructions'
            ];

            for (const section of requiredSections) {
              if (!body.includes(section)) {
                core.setFailed(
                  `Missing required section: ${section}`
                );
              }
            }

            //
            // Ensure all checklist items are checked
            //
            const uncheckedItems =
              body.match(/- \[ \]/g) || [];

            if (uncheckedItems.length > 0) {
              core.setFailed(
                `${uncheckedItems.length} PR checklist item(s) remain unchecked.`
              );
            }

            //
            // Validate commit messages
            //
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            for (const commit of commits) {
              const message =
                commit.commit.message.split('\n')[0];

              if (!ccRegex.test(message)) {
                core.setFailed(
                  `Commit message does not follow Conventional Commits: "${message}"`
                );
              }
            }

            //
            // Validate DCO signoff
            //
            for (const commit of commits) {
              const fullMessage = commit.commit.message;

              if (!fullMessage.includes('Signed-off-by:')) {
                core.setFailed(
                  `Missing Signed-off-by line in commit ${commit.sha}`
                );
              }
            }

            console.log('All PR validation checks passed.');
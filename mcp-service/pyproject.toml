[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-mcp"
version = "0.1.0"
description = "Loss Prevention MCP sensor service for the Central QSR Agent."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14,<3",
]

[project.scripts]
lp-mcp = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "delivery", "events", "jsonl_ingest", "jsonl_watch", "models", "queries", "store", "tools", "main"]

[tool.pytest.ini_options]
pythonpath = ["src"]
